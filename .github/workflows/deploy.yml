name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every three hours, to refresh the rankings snapshot: Codeforces rebuilds its list around midnight UTC,
  # and the build lays each contest's rating changes over it. GitHub delays or drops some scheduled runs,
  # so one a day could leave the rankings a day behind; minute 25 avoids the busy top of the hour.
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloads Codeforces' rated list into public/data/rankings.json (keeps the published copy if it fails).
      - run: npm run data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
